name: Security — CodeQL, Dependency Review, Secret Scan, Audit

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL — SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript, typescript
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"

  dependency-review:
    name: Dependency Review — Supply Chain
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD

  secret-scan:
    name: Secret Scan — TruffleHog + Grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --debug --only-verified
      - name: Grep for credential patterns
        run: |
          set -eu
          if grep -R --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist --exclude-dir=.git -E "ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|vcp_[A-Za-z0-9]{20,}" .; then
            echo "::error::Credential pattern found"
            exit 1
          fi

  npm-audit:
    name: npm Audit — CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts
      - name: npm audit — high severity blocks the build
        run: npm audit --audit-level=high
      - name: Check Electron version
        run: |
          node -e "const v=require('./package.json').devDependencies.electron; const m=parseInt(v.match(/\d+/)[0]); if(m<32) process.exit(1); console.log('Electron >=32')"

  headers-check:
    name: Security Headers — CSP, HSTS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          grep -q "X-Frame-Options" next.config.ts
          grep -q "Content-Security-Policy" next.config.ts
          grep -q "Strict-Transport-Security" next.config.ts
          grep -q "Permissions-Policy" next.config.ts

  electron-hardening:
    name: Electron Hardening — Zero-Trust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          grep -q "contextIsolation: true" electron.js
          grep -q "nodeIntegration: false" electron.js
          grep -q "sandbox: true" electron.js
          grep -q "webSecurity: true" electron.js
          grep -q "setPermissionRequestHandler" electron.js
          grep -q "autoUpdater" electron.js
          grep -q "requestSingleInstanceLock" electron.js
