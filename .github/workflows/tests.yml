name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run safety and workflow tests
        run: |
          python -m pytest tests -q
      - name: Run attack simulation and verify detection
        run: |
          python attacker_sim.py
          python threat_detection.py
          python reports.py
          cat reports/dashboard.txt
      - name: Verify log integrity
        run: |
          python security_logger.py verify
